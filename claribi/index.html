<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/claribi_icon_logo_favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>Claribi Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // CRITICAL: Remove JWT token from URL immediately to prevent exposure
      // This runs before React loads to ensure token is never visible in address bar
      (function() {
        const urlParams = new URLSearchParams(window.location.search);
        const jwtToken = urlParams.get('token');
        
        if (jwtToken) {
          // Store token in localStorage immediately
          localStorage.setItem('jwt_token', jwtToken);
          
          // Remove token from URL immediately - synchronous operation
          const url = new URL(window.location);
          url.searchParams.delete('auth');
          url.searchParams.delete('token');
          window.history.replaceState({}, '', url);
          
          // Mark that this is a login redirect
          sessionStorage.setItem('from_login_redirect', 'true');
        }
        
        // Check if user is trying to access /login while already authenticated
        // This runs before React loads to prevent routing issues
        const isLoggedIn = localStorage.getItem('jwt_token');
        const currentPath = window.location.pathname;
        
        if (isLoggedIn && currentPath === '/login') {
          window.location.replace('/');
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
